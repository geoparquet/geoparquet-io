version: 2
updates:
  # GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    # Wait before adopting fresh releases: compromised versions are usually
    # yanked within days of publication (zizmor dependabot-cooldown).
    cooldown:
      default-days: 7

  # Python dependencies (uv lockfile-aware)
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "python"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "build"
      include: "scope"
    # Wait before adopting fresh releases: compromised versions are usually
    # yanked within days of publication (zizmor dependabot-cooldown).
    cooldown:
      default-days: 7
    # Group minor and patch updates together
    # DuckDB 2.0 cannot run S2 until its geography extension is published.
    # Remove this ignore with the <1.6 cap once #1346's acceptance checks pass.
    ignore:
      - dependency-name: "duckdb"
        versions: [">=2.0.0,<2.1.0"]
    groups:
      development-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
