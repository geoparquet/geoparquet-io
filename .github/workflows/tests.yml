name: Tests
on:
  push:
    branches: [ main, refactor ]
  pull_request:
    branches: [ main ]
    # 'labeled' lets adding the "run-slow-tests" label trigger the slow suite
    # on a PR (see the slow-tests job condition) without a new push.
    types: [ opened, synchronize, reopened, labeled ]
  schedule:
    - cron: '15 2 * * *'  # Run slow tests nightly at 2:15 AM UTC
  workflow_dispatch:  # Allow manual triggering from Actions UI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-extras

      # .pre-commit-config.yaml is the single source of truth for lint/quality
      # rules. CI runs the exact same hooks contributors run locally, so a rule
      # can never exist in only one place and drift (that gap previously let
      # unhooked clones merge house-rule violations).
      - name: Run pre-commit hooks (commit stage)
        env:
          # doc-sync mutates files (the --check step below covers it);
          # sync-dependencies runs `uv sync` against the staged diff, which is
          # meaningless in CI.
          SKIP: doc-sync,sync-dependencies
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: Run pre-commit hooks (pre-push stage)
        run: >-
          uv run pre-commit run --all-files --hook-stage pre-push
          --show-diff-on-failure

      - name: Check generated doc sections are current
        run: uv run python scripts/doc_sync.py --check

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # On scheduled runs, don't fail the workflow for new CVEs - the security-audit
    # workflow handles those proactively. On PRs, we want to block vulnerable code.
    continue-on-error: ${{ github.event_name == 'schedule' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Security scan (bandit)
        run: uv run bandit -r geoparquet_io/ -c pyproject.toml

      - name: Dependency audit
        # Ignore list lives in .pip-audit-ignores (single source of truth,
        # shared with security-audit.yml). Entries auto-expire; see the file.
        run: |
          IGNORE_ARGS=$(uv run python scripts/pip_audit_ignores.py)
          # word-splitting intended: emits repeated --ignore-vuln flags
          # shellcheck disable=SC2086
          uv run pip-audit $IGNORE_ARGS

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      # THE single place that decides which matrix leg reports coverage.
      # Four things key off it (fetch-depth, COV_ARGS, the Codecov upload, the
      # diff-cover gate); when each re-derived `os == ... && python-version ==
      # ...` for itself, moving the baseline (drop 3.11, add 3.14) would have
      # turned all four false at once — no coverage measured, nothing uploaded,
      # and BOTH the 80% floor and the 90% diff-cover gate silently gone with
      # every check green. Change the baseline HERE and everything follows.
      # (Deliberately not a `matrix.coverage` flag added via `include:`: an
      # include-contributed key is appended to the generated job name, so the
      # leg would be reported as `test (ubuntu-latest, 3.11, true)` and the
      # required status check would never arrive.)
      # tests/test_coverage_job.py asserts this names a combination that
      # actually survives the excludes below, and that nobody re-derives it.
      COVERAGE_JOB: >-
        ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
        exclude:
          - os: macos-latest
            python-version: '3.10'
          - os: windows-latest
            python-version: '3.10'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history ONLY for the coverage leg, which runs diff-cover; the
          # other nine cloned the entire history for nothing.
          # Written inverted on purpose: `cond && 0 || 1` always yields 1
          # because 0 is falsy in GitHub expressions, so the depth-1 branch
          # has to be the truthy one.
          fetch-depth: ${{ env.COVERAGE_JOB != 'true' && 1 || 0 }}
          # geoparquet-testing corpus for the corpus conformance tests
          submodules: true

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Pre-install DuckDB extensions
        shell: bash
        run: |
          # DuckDB extension downloads (extensions.duckdb.org) occasionally fail
          # with a transient network error, which broke otherwise-green builds.
          # Retry with backoff before giving up.
          install="import duckdb; con = duckdb.connect(); con.execute('INSTALL spatial'); con.execute('INSTALL httpfs'); con.execute('INSTALL h3 FROM community'); con.execute('INSTALL geography FROM community')"
          for attempt in 1 2 3 4 5; do
            if uv run python -c "$install"; then
              echo "DuckDB extensions installed (attempt $attempt)."
              exit 0
            fi
            echo "Extension install failed (attempt $attempt). Retrying in $((attempt * 10))s..." >&2
            sleep $((attempt * 10))
          done
          echo "Failed to install DuckDB extensions after 5 attempts." >&2
          exit 1

      - name: Install tippecanoe
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y tippecanoe
          elif [ "$RUNNER_OS" == "macOS" ]; then
            brew install tippecanoe
          fi

      - name: Run fast tests with pytest (parallel)
        shell: bash
        env:
          # Only the COVERAGE_JOB leg consumes coverage (Codecov upload and the
          # diff-cover gate below). The other nine matrix jobs instrumented
          # every line and every spawned subprocess, then threw the result away.
          #
          # On the speed claim, precisely: the 39-49% figure quoted in
          # CHANGELOG/pyproject is a LOCAL single-file run, where interpreter
          # start-up and collection dominate. It does not describe these jobs.
          # Total CI matrix wall time did NOT measurably improve — 5926s before
          # vs 5980s after, n=1, well inside run-to-run noise. The reason to do
          # this is that instrumenting nine jobs to discard the result is waste
          # and obscures where the gate lives, not a matrix speedup.
          #
          # The reporting job passes every flag explicitly because `addopts` no
          # longer carries them: the 80% floor is enforced HERE.
          COV_ARGS: >-
            ${{ env.COVERAGE_JOB == 'true'
            && '--cov=geoparquet_io --cov-report=term-missing --cov-report=xml --cov-fail-under=80'
            || '--no-cov' }}
        run: |
          # word-splitting intended: COV_ARGS is a flag list (or --no-cov)
          # shellcheck disable=SC2086
          if [ "$RUNNER_OS" == "Windows" ]; then
            # Use loadfile distribution on Windows to reduce DuckDB extension conflicts
            uv run pytest -n 4 --dist=loadfile -m "not slow and not network and not meta" -v --tb=short --durations=25 --durations-min=0.5 $COV_ARGS
          elif [ "$RUNNER_OS" == "macOS" ]; then
            uv run pytest -n 3 -m "not slow and not network and not meta" -v --tb=short --durations=25 --durations-min=0.5 $COV_ARGS
          else
            uv run pytest -n 4 -m "not slow and not network and not meta" -v --tb=short --durations=25 --durations-min=0.5 $COV_ARGS
          fi

      - name: Upload coverage to Codecov
        if: env.COVERAGE_JOB == 'true'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Diff coverage gate (changed lines >= 90% covered)
        if: >-
          github.event_name == 'pull_request' && env.COVERAGE_JOB == 'true'
        env:
          BASE_REF: ${{ github.base_ref }}
        # Coverage comes from the fast suite, so changed lines must be covered
        # by fast tests specifically — intended pressure: new code ships with
        # tests that run on every PR, not only in the post-merge slow suite.
        run: |
          git fetch origin "$BASE_REF"
          uv run diff-cover coverage.xml \
            --compare-branch "origin/$BASE_REF" --fail-under=90

  notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Test example notebooks
        run: |
          uv run pytest --nbmake examples/*.ipynb -v --nbmake-timeout=120 --no-cov

  docs-examples:
    # Every fenced example in docs/guide/ that does not need the internet, run on
    # every pull request. `testpaths` already collects docs/guide, so these blocks
    # were reaching CI sorted only by marker: 57 landed in the fast matrix, ~398 in
    # slow-tests -- which does NOT run on pull requests. The large majority of the
    # documented commands were therefore verified only after merge (#896).
    #
    # One runner, not the ten of the fast matrix: these assert that a documented
    # command still works, which is not per-interpreter behaviour. The 57 blocks
    # already in the fast lane keep their Windows and macOS coverage there; the
    # rest stay Linux-only until slow-tests picks them up on merge. That is a real
    # gap for the shell-quoting and path-encoding bugs this repo has seen only on
    # Windows -- named here rather than glossed, and cheap to close later by adding
    # an os matrix if it ever bites.
    #
    # Deliberately NOT in the required-checks list yet. #894 was this lane reading
    # as flaky; its network blocks are excluded here, but the ~234 that execute all
    # spawn CLI subprocesses, the same shape as the known xdist flakes in
    # test_pipe_integration / test_geojson_stream / e2e/test_journeys. Let it report
    # for a couple of weeks before promoting it to a gate.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-extras

      # ogr2ogr backs 8 convert.md fences and tippecanoe 11 in geojson.md; without
      # them those blocks skip via needs-ogr / needs-tippecanoe rather than fail, so
      # installing both is what makes this job cover the pages it claims to.
      - name: Install GDAL
        run: sudo apt-get update && sudo apt-get install -y gdal-bin

      - name: Install tippecanoe
        run: sudo apt-get install -y tippecanoe

      - name: Pre-install DuckDB extensions
        run: |
          # Same transient-failure retry as the fast matrix: extensions.duckdb.org
          # occasionally drops a request and breaks an otherwise-green build.
          install="import duckdb; con = duckdb.connect(); con.execute('INSTALL spatial'); con.execute('INSTALL httpfs'); con.execute('INSTALL h3 FROM community'); con.execute('INSTALL geography FROM community')"
          for attempt in 1 2 3 4 5; do
            if uv run python -c "$install"; then
              echo "DuckDB extensions installed (attempt $attempt)."
              exit 0
            fi
            echo "Extension install failed (attempt $attempt). Retrying in $((attempt * 10))s..." >&2
            sleep $((attempt * 10))
          done
          echo "Failed to install DuckDB extensions after 5 attempts." >&2
          exit 1

      - name: Run guide examples
        run: |
          # network-marked fences need multi-hundred-MB downloads and live in the
          # non-blocking network-tests job; --no-cov because this lane exists to
          # check the guide, not to move the coverage number.
          #
          # -n 4, not -n auto, and the difference is not cosmetic. Every block
          # shells out to `gpio`, which itself opens a multi-threaded DuckDB, so
          # one pytest worker is already several busy cores. Measured locally:
          # -n auto (12 workers) produced 35 failures in 857s, all of them
          # BLOCK_TIMEOUT_SECONDS expiring under contention rather than a broken
          # example -- add.md:L62 alone passes in 14.5s. The same selection run
          # serially was 235 passed / 0 failed in 271s. -n 4 matches what the
          # harness README and every other job here already use.
          uv run pytest -n 4 -m "docs_example and not network" \
            --no-cov --tb=short --durations=15 --durations-min=1.0

  slow-tests:
    # Slow tests run on merge to main, schedule, and manual dispatch. They do NOT
    # run on every PR (too slow), but can be opted in per-PR by adding the
    # "run-slow-tests" label, so risky changes can be verified before merge.
    # Network-marked tests are deliberately excluded: they hit live third-party
    # servers and live in the non-blocking network-tests job below.
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'run-slow-tests'))
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # geoparquet-testing corpus for the corpus conformance tests
          submodules: true

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install GDAL (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gdal-bin

      - name: Install GDAL (macOS)
        if: runner.os == 'macOS'
        run: brew install gdal

      # Note: GDAL is not easily installable on Windows via Chocolatey.
      # FileGDB tests will gracefully skip on Windows and run on Linux/macOS.

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Pre-install DuckDB extensions
        shell: bash
        run: |
          # DuckDB extension downloads (extensions.duckdb.org) occasionally fail
          # with a transient network error, which broke otherwise-green builds.
          # Retry with backoff before giving up.
          install="import duckdb; con = duckdb.connect(); con.execute('INSTALL spatial'); con.execute('INSTALL httpfs'); con.execute('INSTALL h3 FROM community'); con.execute('INSTALL geography FROM community')"
          for attempt in 1 2 3 4 5; do
            if uv run python -c "$install"; then
              echo "DuckDB extensions installed (attempt $attempt)."
              exit 0
            fi
            echo "Extension install failed (attempt $attempt). Retrying in $((attempt * 10))s..." >&2
            sleep $((attempt * 10))
          done
          echo "Failed to install DuckDB extensions after 5 attempts." >&2
          exit 1

      - name: Install tippecanoe
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y tippecanoe
          elif [ "$RUNNER_OS" == "macOS" ]; then
            brew install tippecanoe
          fi

      - name: Run slow tests (parallel)
        shell: bash
        env:
          # Only ubuntu uploads slow-suite coverage to Codecov (step below);
          # macOS and Windows discarded theirs. --cov-fail-under=0 stays on the
          # reporting job because the slow suite alone never reaches the 80%
          # floor that [tool.coverage.report] would otherwise apply.
          COV_ARGS: >-
            ${{ matrix.os == 'ubuntu-latest'
            && '--cov=geoparquet_io --cov-report=xml --cov-report=term-missing --cov-fail-under=0'
            || '--no-cov' }}
        run: |
          # The selection is "(slow or meta) and not network". `meta` is the
          # repo-tooling lane (codespell, commitizen, doc-sync, mutmut, mypy,
          # validate-claude-md, the security-tool availability checks). Those
          # are excluded from the fast suite -- they spawn subprocesses and
          # caused its only flakes -- so this job is where they still run.
          #
          # tests/test_security.py is NOT excluded here: the marker selection
          # already skips everything in it except the two `meta`-marked tool
          # availability checks, and excluding the file outright would leave
          # those running in no CI job at all. The live pip-audit that used to
          # justify a file-level ignore no longer lives there -- see the NOTE
          # in tests/test_security.py, which records why it must stay owned by
          # the dedicated `security` job and never come back as a pytest test.

          # word-splitting intended: COV_ARGS is a flag list (or --no-cov).
          # The directive binds to the NEXT command, so it has to sit here and
          # not at the top of the block (where it would bind to the assignment
          # above and leave all three invocations unsuppressed).
          # shellcheck disable=SC2086
          if [ "$RUNNER_OS" == "Windows" ]; then
            # Use loadfile distribution on Windows to reduce DuckDB extension conflicts
            uv run pytest -n 4 --dist=loadfile -m "(slow or meta) and not network" -v --tb=short --durations=25 --durations-min=0.5 $COV_ARGS
          elif [ "$RUNNER_OS" == "macOS" ]; then
            uv run pytest -n 3 -m "(slow or meta) and not network" -v --tb=short --durations=25 --durations-min=0.5 $COV_ARGS
          else
            uv run pytest -n 4 -m "(slow or meta) and not network" -v --tb=short --durations=25 --durations-min=0.5 $COV_ARGS
          fi

      - name: Upload slow test coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage.xml
          flags: slowtests
          name: codecov-slow
          fail_ci_if_error: false

  network-tests:
    # Live third-party services (ArcGIS, WFS, Carto, BigQuery, ...). A remote
    # server's flakiness is not something a PR author can fix, so this job is
    # non-blocking: the failing STEP is continue-on-error (workflow stays
    # green) and failures open/update a single tracking issue instead —
    # mirroring the security-audit.yml pattern. It is intentionally NOT in the
    # required-checks list.
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install GDAL
        run: sudo apt-get update && sudo apt-get install -y gdal-bin

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Pre-install DuckDB extensions
        shell: bash
        run: |
          # DuckDB extension downloads (extensions.duckdb.org) occasionally fail
          # with a transient network error, which broke otherwise-green builds.
          # Retry with backoff before giving up.
          install="import duckdb; con = duckdb.connect(); con.execute('INSTALL spatial'); con.execute('INSTALL httpfs'); con.execute('INSTALL h3 FROM community'); con.execute('INSTALL geography FROM community')"
          for attempt in 1 2 3 4 5; do
            if uv run python -c "$install"; then
              echo "DuckDB extensions installed (attempt $attempt)."
              exit 0
            fi
            echo "Extension install failed (attempt $attempt). Retrying in $((attempt * 10))s..." >&2
            sleep $((attempt * 10))
          done
          echo "Failed to install DuckDB extensions after 5 attempts." >&2
          exit 1

      - name: Install tippecanoe
        run: sudo apt-get install -y tippecanoe

      - name: Run network tests (serial, forked)
        id: nettests
        continue-on-error: true
        run: |
          # Serial (no xdist): a live-fetch segfault (see the Vermont ArcGIS
          # test for #334) kills an xdist worker and poisons every sibling
          # test's verdict. --forked confines a crash to the one test that
          # crashed; --timeout caps a hung remote; --reruns absorbs transient
          # network errors.
          # -rfE prints a short "FAILED/ERROR" summary at the tail; tee keeps
          # a copy so the run-summary + tracking-issue steps below can name the
          # tests that failed. pipefail (on by default for GitHub's bash steps,
          # set explicitly here as insurance) makes the pipeline exit with
          # pytest's status, so a failure still marks this step failed.
          set -o pipefail
          uv run pytest -p no:xdist --forked -m network \
            --ignore=tests/test_security.py \
            --timeout=180 --timeout-method=thread \
            --reruns 2 --reruns-delay 10 \
            -v --tb=short --no-cov -rfE \
            2>&1 | tee network-test-output.txt

      - name: Surface network-test failure in run summary
        # continue-on-error above keeps the job badge green even though the
        # step's real outcome was 'failure' — which has misled triage. Make the
        # failure legible in the run summary and capture the failing test names
        # for the tracking issue. Pass/fail semantics are untouched: this only
        # runs on the failure path and only adds information.
        if: steps.nettests.outcome == 'failure'
        run: |
          {
            echo "## ⚠️ Live network tests FAILED (non-blocking)"
            echo ""
            echo "The \`network-tests\` step outcome was **failure**, but the job"
            echo "badge stays green by design (live third-party services). See the"
            echo "tracking issue for history."
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          if grep -E '^(FAILED|ERROR)' network-test-output.txt \
               > network-test-failures.txt; then
            {
              echo "Failing tests:"
              echo ""
              echo '```'
              cat network-test-failures.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_No individual FAILED/ERROR lines were captured (the step may" \
                 "have crashed before pytest reported)._" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Open or update tracking issue on failure
        if: steps.nettests.outcome == 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            // Failing-test names captured by the "Surface network-test failure"
            // step (pytest -rfE short summary). Best-effort: absent if the step
            // crashed before pytest reported.
            let failures = '';
            try {
              failures = fs.readFileSync('network-test-failures.txt', 'utf8').trim();
            } catch {}
            const failuresBlock = failures
              ? ['**Failing tests:**', '', '```', failures, '```']
              : ['_Failing test names were not captured — see the run log._'];
            const title = '🌐 Network tests failing against live services';
            const body = [
              '## Automated network-test report',
              '',
              'The non-blocking `network-tests` job failed. These tests hit',
              'live third-party services, so this usually means a remote',
              'endpoint changed, broke, or throttled us — but it can also be',
              'a real regression in our extractors.',
              '',
              ...failuresBlock,
              '',
              `- **Run**: [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              `- **Date**: ${new Date().toISOString().split('T')[0]}`,
              '',
              '---',
              '*Opened/updated automatically by the network-tests job; it will*',
              '*be closed automatically when the suite passes again.*'
            ].join('\n');

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'network-tests,automated',
              per_page: 100
            });
            const existing = issues.data.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['network-tests', 'automated']
              });
            }

      - name: Close tracking issue on success
        if: steps.nettests.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = '🌐 Network tests failing against live services';
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'network-tests,automated',
              per_page: 100
            });
            const existing = issues.data.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: 'closed',
                state_reason: 'completed'
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: '✅ Network tests passing again. Closing automatically.'
              });
            }
