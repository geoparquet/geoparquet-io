name: CI performance investigation

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Bounded diagnostic experiment
        type: choice
        default: narrow
        options: [narrow, suite, native, database]
      platform:
        description: Operating systems to measure
        type: choice
        default: both
        options: [both, windows, linux]

permissions:
  contents: read

jobs:
  profile:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform == 'windows' && '["windows-latest"]' || inputs.platform == 'linux' && '["ubuntu-latest"]' || '["windows-latest","ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: true
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          enable-cache: true
      - name: Install the historical environment
        run: uv sync --frozen --all-extras --python 3.11.18
      - name: Prewarm DuckDB extensions
        shell: bash
        run: |
          uv run --no-sync python - <<'ENDPY'
          import duckdb
          con = duckdb.connect()
          for extension in ('spatial', 'httpfs', 'aws'):
              con.execute('INSTALL ' + extension)
          for extension in ('h3', 'geography', 'a5'):
              con.execute('INSTALL ' + extension + ' FROM community')
          ENDPY
      - name: Run bounded experiments
        env:
          INVESTIGATION_MODE: ${{ inputs.mode }}
        shell: bash
        run: uv run --no-sync python .github/ci_investigation/run.py --mode "$INVESTIGATION_MODE"
      - name: Upload raw profiles, phase timings, process samples, and stack dumps
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ci-profile-${{ matrix.os }}-${{ inputs.mode }}
          path: ci-evidence/
          retention-days: 5
