# Benchmark Suite Workflow
# Runs performance benchmarks on-demand via workflow_dispatch or when 'benchmark' label is added to PRs
name: Benchmark Suite

on:
  workflow_dispatch:
    inputs:
      iterations:
        description: 'Number of iterations per operation'
        required: false
        default: '3'
        type: string
      files:
        description: 'File sizes to benchmark (quick, standard, full, or comma-separated)'
        required: false
        default: 'full'
        type: string
      ops:
        description: 'Operations to benchmark (quick, standard, full, or comma-separated)'
        required: false
        default: 'full'
        type: string
      compare_version:
        description: 'Version to compare against (e.g., v0.9.0, main)'
        required: false
        default: ''
        type: string

  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  check-trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - id: check
        env:
          # Pass attacker-controllable label name via env, not template expansion,
          # to avoid shell injection.
          EVENT_NAME: ${{ github.event_name }}
          LABEL_NAME: ${{ github.event.label.name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          elif [[ "$LABEL_NAME" == "benchmark" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  benchmark:
    needs: check-trigger
    if: needs.check-trigger.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Only the benchmark job posts PR comments, so scope the write here rather
    # than at the top level (least privilege).
    permissions:
      contents: read
      pull-requests: write
    env:
      # Use environment variables to safely pass user inputs to shell commands
      ITERATIONS: ${{ inputs.iterations || '3' }}
      FILES: ${{ inputs.files || 'full' }}
      OPS: ${{ inputs.ops || 'full' }}
      COMPARE_VERSION: ${{ inputs.compare_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate inputs
        run: |
          # Validate iterations is a positive integer
          if ! [[ "$ITERATIONS" =~ ^[0-9]+$ ]] || [[ "$ITERATIONS" -lt 1 ]]; then
            echo "Error: iterations must be a positive integer"
            exit 1
          fi
          # Validate files and ops are alphanumeric with allowed chars
          if ! [[ "$FILES" =~ ^[a-zA-Z0-9,_-]+$ ]]; then
            echo "Error: files must be alphanumeric with commas, underscores, or hyphens"
            exit 1
          fi
          if ! [[ "$OPS" =~ ^[a-zA-Z0-9,_-]+$ ]]; then
            echo "Error: ops must be alphanumeric with commas, underscores, or hyphens"
            exit 1
          fi
          # Validate compare_version if provided (git ref format)
          if [[ -n "$COMPARE_VERSION" ]] && ! [[ "$COMPARE_VERSION" =~ ^[a-zA-Z0-9._/-]+$ ]]; then
            echo "Error: compare_version must be a valid git ref"
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install system dependencies (GDAL for import operations)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgdal-dev gdal-bin

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Pre-install DuckDB extensions
        run: |
          uv run python -c "import duckdb; con = duckdb.connect(); con.execute('INSTALL spatial'); con.execute('INSTALL httpfs')"

      - name: Run benchmarks (current)
        run: |
          uv run python scripts/version_benchmark.py \
            --version-label "${{ github.sha }}" \
            -o results_current.json \
            -n "$ITERATIONS" \
            --files "$FILES" \
            --ops "$OPS"

      - name: Checkout and benchmark comparison version
        if: inputs.compare_version != ''
        run: |
          # Save current results
          cp results_current.json /tmp/results_current.json

          # Checkout comparison version (already validated above)
          git fetch --tags --depth=1 origin
          git checkout "$COMPARE_VERSION"

          # Reinstall at that version
          uv sync --all-extras

          # Run benchmarks
          uv run python scripts/version_benchmark.py \
            --version-label "$COMPARE_VERSION" \
            -o results_baseline.json \
            -n "$ITERATIONS" \
            --files "$FILES" \
            --ops "$OPS"

          # Restore current and compare
          cp /tmp/results_current.json results_current.json
          git checkout ${{ github.sha }}
          uv sync --all-extras

          {
            echo "## Benchmark Comparison"
            echo ""
            echo "\`\`\`"
            uv run python scripts/version_benchmark.py \
              --compare results_baseline.json results_current.json
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate summary (no comparison)
        if: inputs.compare_version == ''
        run: |
          {
            echo "## Benchmark Results"
            echo ""
            echo "Version: ${{ github.sha }}"
            echo ""
            echo "\`\`\`json"
            cat results_current.json
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check for regressions and run profiling
        if: inputs.compare_version != ''
        run: |
          # Parse comparison output to detect regressions > 10%
          COMPARISON_OUTPUT=$(uv run python scripts/version_benchmark.py \
            --compare results_baseline.json results_current.json 2>&1 || true)

          echo "$COMPARISON_OUTPUT"

          # A detected regression is now a hard gate. The PR-comment step runs
          # with `if: always()` so results still post even when this step fails.
          # compare_results() prints per-operation deltas as "+{delta:.1f}% slower";
          # extract the largest and fail when it reaches 10%.
          MAX_REGRESSION=$(echo "$COMPARISON_OUTPUT" \
            | grep -oE '\+[0-9]+\.[0-9]+% slower' \
            | grep -oE '[0-9]+\.[0-9]+' \
            | sort -rn | head -1)

          if [ -n "$MAX_REGRESSION" ] && awk "BEGIN { exit !($MAX_REGRESSION >= 10) }"; then
            echo "::error::Performance regression detected: ${MAX_REGRESSION}% slower (threshold: 10%)"
            echo ""
            echo "To diagnose, run profiling locally:"
            echo "  gpio benchmark suite --files <file> --profile --profile-dir ./profiles"
            exit 1
          fi

      - name: Upload results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: benchmark-results-${{ github.sha }}
          path: |
            results_*.json
            profiles/*.prof
          retention-days: 30

      - name: Comment on PR
        # Run even when the regression gate above fails, so benchmark numbers
        # still get posted to the PR alongside the failure.
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            // With `always()`, this step can run even if benchmarks never produced
            // results (e.g. an earlier hard failure). Bail out quietly in that case.
            if (!fs.existsSync('results_current.json')) {
              core.warning('results_current.json not found — skipping PR comment.');
              return;
            }
            const results = JSON.parse(fs.readFileSync('results_current.json', 'utf8'));

            let body = '## Benchmark Results\n\n';
            body += `**Version:** \`${results.version}\`\n`;
            body += `**GPIO Version:** ${results.gpio_version}\n`;
            body += `**Iterations:** ${results.iterations}\n\n`;
            body += '| Operation | File | Avg Time | Min | Max |\n';
            body += '|-----------|------|----------|-----|-----|\n';

            for (const b of results.benchmarks) {
              if (b.avg_time !== null) {
                body += `| ${b.operation} | ${b.file_size} | ${b.avg_time.toFixed(3)}s | ${b.min_time.toFixed(3)}s | ${b.max_time.toFixed(3)}s |\n`;
              } else {
                body += `| ${b.operation} | ${b.file_size} | FAILED | - | - |\n`;
              }
            }

            body += '\n\n---\n';
            body += '💡 **Profiling available**: To diagnose performance bottlenecks, run:\n';
            body += '```bash\n';
            body += 'gpio benchmark suite --files <file> --profile --profile-dir ./profiles\n';
            body += '```\n';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
