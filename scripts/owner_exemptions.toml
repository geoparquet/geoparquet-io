# pylint R0801 (scripts/check_pylint_duplicates.py, the pylint-duplicates hook).
# One entry per reported block, keyed by the module and the function (or class,
# or <module>) each side starts in (geoparquet_io. dropped), counted by report;
# the wrapper fails when the tree differs, so swapping one copy for another
# between the same two modules fails too. Most are keyword-argument lists forwarded to one callee:
# R0801 counts lines, not logic, so those are permanent.
[[G3.pylint]]
block = "api.ops:aggregate_admin|api.table:Table.aggregate_admin"
reason = "permanent: the same keyword-argument list forwarded to one callee (API/CLI facade or write-funnel call), not a second implementation"
[[G3.pylint]]
block = "api.ops:contour|core.process.raster.contour:contour_file"
reason = "permanent: the same keyword-argument list forwarded to one callee (API/CLI facade or write-funnel call), not a second implementation"
[[G3.pylint]]
