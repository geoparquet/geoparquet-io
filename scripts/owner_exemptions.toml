# G13: shared-option consistency (tests/test_cli_shared_options.py)
# ---------------------------------------------------------------------------
# Option names declared on more than one command whose type, default, callback,
# multiple or is_flag differ, with the fields that differ. The set is exact: a
# new difference fails, and a unified option must leave the list.
# Not here: --bbox (every declaration is the same str; the parse layer has its
# own arm, tests/test_cli_shared_options.py's inline_bbox_parsers, which finds
# none since T5c routed them to core/bbox_parse.parse_bbox: add a
# [[G13.bbox_parsers]] entry only if one must stay) and --json/--markdown
# (declared repeatedly but identically).
[[G13.options]]
option = "--auto"
fields = ["type", "is_flag"]
reason = "permanent: two meanings, kdtree's --auto N (target partition count) and a bool switch on the index commands"
[[G13.options]]
option = "--bbox-name"
fields = ["default"]
reason = "permanent: add bbox names the new column ('bbox'); add bbox-metadata detects the existing one when not given"
[[G13.options]]
option = "--encoding"
fields = ["default"]
reason = "permanent: convert geoparquet auto-detects (None); shapefile DBF text defaults to UTF-8"
[[G13.options]]
