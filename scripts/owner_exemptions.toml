# ---------------------------------------------------------------------------
# G2: owner-only definitions (scripts/check_owner_defs.py)
# ---------------------------------------------------------------------------
# Each key is an fnmatch glob over a def name; only the listed modules may
# define a name in its family anywhere under geoparquet_io/. A leading
# underscore on either side is ignored (_is_geographic_crs is an
# is_geographic*), and [G2.known_copies] adds renamed copies by exact name.
[G2.owners]
"is_geographic*" = ["geoparquet_io/core/crs_utils.py"]
"*crs_equal*" = ["geoparquet_io/core/crs_utils.py"]
"resolve_*version*" = ["geoparquet_io/core/parquet_writer.py"]
# Covering *builders* only. The wider *covering* also caught 19 checks,
# predicates, lookups and repairs that read a covering and are not copies of
# build_bbox_covering (T0b audit), so the family is narrowed to the builder shapes.
"build_*covering*" = ["geoparquet_io/core/geo_metadata.py", "geoparquet_io/core/bbox_structure.py"]
"*covering_for" = ["geoparquet_io/core/geo_metadata.py", "geoparquet_io/core/bbox_structure.py"]
"*covering_metadata" = ["geoparquet_io/core/geo_metadata.py", "geoparquet_io/core/bbox_structure.py"]
"parse_size*" = ["geoparquet_io/core/sizing.py"]
"format_size*" = ["geoparquet_io/core/sizing.py"]
# atomic_write lives in write_strategies/base.py until T2f moves it to
# file_utils (re-exported from write_funnels); T2f changes this owner with the move.
"atomic_write" = ["geoparquet_io/core/write_strategies/base.py"]
"_is_geography_column" = ["geoparquet_io/core/duckdb_metadata.py"]
"_compute_geometry_types" = ["geoparquet_io/core/geo_metadata.py"]
"_compute_bbox_from_data" = ["geoparquet_io/core/geo_metadata.py"]
"handle_output_overwrite" = ["geoparquet_io/core/file_utils.py"]
"is_remote_url" = ["geoparquet_io/core/remote.py"]
"parse_bbox" = ["geoparquet_io/core/bbox_parse.py"]
"_get_query_columns" = ["geoparquet_io/core/duckdb_utils.py"]
"*unique_name*" = ["geoparquet_io/core/column_selection.py"]
"*_with_retry" = ["geoparquet_io/core/http_retry.py"]
"_ensure_*_column" = ["geoparquet_io/core/index_ops.py"]
"build_spatial_join*" = ["geoparquet_io/core/duckdb_utils.py"]
"_align*schema" = ["geoparquet_io/core/arrow_types.py"]
"_unify*schema" = ["geoparquet_io/core/arrow_types.py"]
"_reconcile*schema" = ["geoparquet_io/core/arrow_types.py"]

# Renamed copies no glob sees, by the family they belong to (the #1367
# Copies rows and the T0b audit). Each is also an exemption below.
[G2.known_copies]
"resolve_*version*" = ["_detect_version_from_table", "extract_version_from_metadata", "detect_version_for_output"]
"*crs_equal*" = ["_crs_are_equivalent", "_crs_matches"]
"format_size*" = ["_format_memory_limit"]
"*unique_name*" = ["free_column_name", "_suffixed_to_unique"]
"parse_bbox" = ["_normalize_bbox", "_validated_bbox"]

# Owners named above that do not exist yet. bbox_parse.py is a placeholder
# (T5c decides parse_bbox's home); index_ops.py arrives with T5b.
[G2.pending_owners]
"geoparquet_io/core/bbox_parse.py" = "placeholder home for parse_bbox; T5c decides"
"geoparquet_io/core/index_ops.py" = "created by T5b for the _ensure_*_column family"

