# The one exemptions file for the owner guards of #1367 ("one owner per concept").
#
# Every check that bans a pattern outside its owner module keeps its exceptions
# here, one entry per copy, each with a reason. tests/test_owner_guards.py pins
# how many entries each check has and fails on an entry that no longer matches
# anything, so a number only ever goes down, and only with a diff that shows it.
# When you delete a copy, delete its entry and lower the count in
# tests/test_owner_guards.py::EXPECTED_COUNTS in the same commit.
#
# Entry keys: path (from the repo root), optional name (the enclosing def's
# dotted name, the banned API for G1.tid251, the def name for G2), optional
# line_pattern (a regex on the source line), optional count (how many hits the
# entry covers, default 1), and reason (mandatory).
#
# Never add an entry to make a new copy pass. Call the owner.

