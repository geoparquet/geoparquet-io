repos:
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.1.0
    hooks:
      - id: commitizen
        stages: [commit-msg]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict
      - id: check-toml
      - id: mixed-line-ending

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.1
    hooks:
      # Run the linter
      - id: ruff
        args: [--fix]
      # Run the formatter
      - id: ruff-format

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.2
    hooks:
      - id: codespell
        additional_dependencies:
          - tomli

  # Lint GitHub Actions workflow syntax/semantics
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  # Audit GitHub Actions workflows for security issues (unpinned actions,
  # missing permissions, template injection, ...). Offline mode keeps it
  # deterministic and token-free.
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.26.1
    hooks:
      - id: zizmor
        args: [--no-online-audits]

  # -------------------------------------------------------------------------
  # Local hooks - commit stage (fast, <10s total)
  # -------------------------------------------------------------------------
  - repo: local
    hooks:
      # Block DuckDB 1.5 anti-patterns that cause crashes
      - id: duckdb-antipatterns
        name: duckdb-antipatterns
        description: Block DuckDB patterns that crash in 1.5+
        entry: bash
        args:
          - -c
          - |
            errors=0
            # fetch_arrow_table() crashes with TransactionContext error
            # Exclude comments (lines starting with #) and docstrings
            if grep -rn "\.fetch_arrow_table()" geoparquet_io/ --include="*.py" | grep -v "^\s*#" | grep -v "DuckDB 1.5"; then
              echo "ERROR: Use .arrow().read_all() instead of .fetch_arrow_table() (crashes in DuckDB 1.5)"
              errors=1
            fi
            # to_arrow_table() also crashes
            if grep -rn "\.to_arrow_table()" geoparquet_io/ --include="*.py" | grep -v "^\s*#" | grep -v "DuckDB 1.5"; then
              echo "ERROR: Use .arrow().read_all() instead of .to_arrow_table() (crashes in DuckDB 1.5)"
              errors=1
            fi
            # TRY_CAST to GEOMETRY is broken - only match actual SQL, not comments
            if grep -rn 'TRY_CAST.*AS GEOMETRY' geoparquet_io/ --include="*.py" | grep -v "^\s*#" | grep -v "DuckDB 1.5" | grep -v "instead of"; then
              echo "ERROR: Use TRY(ST_GeomFromText(x)) instead of TRY_CAST(x AS GEOMETRY)"
              errors=1
            fi
            # Per-call always_xy in ST_Transform is an antipattern - set it once at the
            # session level instead. Scoped to ST_Transform so pyproj Transformer(always_xy=True),
            # which is correct, is not flagged. (Recurring CRS fix; see CLAUDE.md.)
            # awk filters comment lines by testing the code text (field 3+), since
            # grep -rn prefixes each line with "path:line:" so "^\s*#" never matches.
            # grep . restores exit-status gating (awk always exits 0).
            if grep -rnE 'ST_Transform[^;]*always_xy' geoparquet_io/ --include="*.py" | awk -F: '$3 !~ /^[[:space:]]*#/' | grep .; then
              echo "ERROR: Use session-level 'SET geometry_always_xy = true' instead of ST_Transform(..., always_xy := true)"
              errors=1
            fi
            # apply_crs_to_parquet() was removed - use _wrap_query_with_crs() instead
            if grep -rn 'apply_crs_to_parquet' geoparquet_io/ --include="*.py" | awk -F: '$3 !~ /^[[:space:]]*#/' | grep .; then
              echo "ERROR: apply_crs_to_parquet() was removed. Use _wrap_query_with_crs() instead."
              errors=1
            fi
            # Bare duckdb.connect() bypasses get_duckdb_connection()'s mandatory
            # session settings (arrow_large_buffer_size for >2GB Arrow exports,
            # geometry_always_xy for DuckDB 1.5 axis order, spatial extension
            # loading) and silently drifts whenever the factory gains a new one.
            # duckdb.sql/query/execute/read_parquet are covered too: each spins up
            # the same unconfigured implicit default connection.
            # core/duckdb_utils.py itself is exempt (matched on the path field, not
            # the line text): it's the factory's own internal connect().
            # Deliberate exceptions elsewhere: trailing "# allow-bare-connect".
            if grep -rnE 'duckdb\.(connect|sql|query|execute|read_parquet)\(' geoparquet_io/ --include="*.py" | awk -F: '$1 != "geoparquet_io/core/duckdb_utils.py"' | grep -v 'allow-bare-connect' | awk -F: '$3 !~ /^[[:space:]]*#/' | grep .; then
              echo "ERROR: Use get_duckdb_connection() from core/duckdb_utils.py instead of bare duckdb.connect() - it applies mandatory session settings (arrow_large_buffer_size, geometry_always_xy, spatial extension loading) that bare connect() silently omits."
              echo "       Deliberate exception? Add a trailing '# allow-bare-connect' comment."
              errors=1
            fi
            # The rule above keys on the 'duckdb.' prefix, so keep the import canonical:
            # an alias or a direct symbol import would slip straight past it.
            if grep -rnE '^[[:space:]]*(import duckdb as |from duckdb import)' geoparquet_io/ --include="*.py" | awk -F: '$1 != "geoparquet_io/core/duckdb_utils.py"' | grep .; then
              echo "ERROR: Import duckdb as 'import duckdb' only - an alias or 'from duckdb import connect' evades the bare-connect check above."
              errors=1
            fi
            # Hand-rolled identifier quoting. f'"{col}"' and col.replace('"', '""')
            # tolerate a space but silently break on an embedded double quote, and a
            # column name can come straight from a file's geo.primary_column or from
            # --column/--bbox-name, so this is an injection vector, not a nit. This
            # exact fix has been made by hand at least eight times (c3c1d43, f6bc56e,
            # 009a2b7, 9f391a2, 0f850ad, 40f151b, 35a1f3f, 3f24514) without a guard.
            # Use quote_identifier() for identifiers and _escape_sql_string() for SQL
            # string literals; both live in core/duckdb_utils.py, which implements
            # them and is therefore exempt. Justify a rare, deliberate exception with
            # a trailing "# allow-manual-quote" comment.
            # The \" arm is deliberately NOT anchored to the start of the
            # f-string: extract.py's `f"ST_Intersects(\"{geometry_col}\", ...)"`
            # (#936) was the same bug mid-string and slipped straight past the
            # anchored version of this rule.
            # core/extract_bigquery.py is exempt by path, not because it is
            # clean: BigQuery reads "..." as a STRING literal, so its sites need
            # backticks rather than quote_identifier and are tracked in #932.
            if grep -rnE 'f'"'"'"\{|\\"\{|\.replace\('"'"'"'"'"', '"'"'""'"'"'\)' geoparquet_io/ --include="*.py" \
                | grep -v '^geoparquet_io/core/duckdb_utils.py:' \
                | grep -v '^geoparquet_io/core/extract_bigquery.py:' \
                | grep -v 'allow-manual-quote' \
                | awk -F: '$3 !~ /^[[:space:]]*#/' | grep .; then
              echo "ERROR: Do not hand-roll SQL identifier quoting."
              echo "       Use quote_identifier(name) from core/duckdb_utils.py for identifiers"
              echo "       and _escape_sql_string(value) for SQL string literals."
              echo "       f'\"{col}\"' does not double an embedded '\"' and breaks on a"
              echo "       hostile geo.primary_column / --column value."
              echo "       Justify a rare exception with a trailing '# allow-manual-quote'."
              errors=1
            fi
            # Hand-written `FROM '{path}'` interpolation. The quotes belong to
            # sql_path(), which quotes and escapes in one step, so the escape
            # cannot be forgotten - it was forgotten for `add admin-divisions`,
            # which wrote its output file and then died with a ParserException on
            # an output path containing an apostrophe (#718). This began as a
            # per-file ratchet over a checked-in baseline, because the 118
            # existing sites were correct (they interpolated an already-escaped
            # safe_file_url() result) and could not be rewritten in one
            # reviewable diff. #802 migrated all of them, so the baseline is
            # empty and this is now a flat ban; `--update` exempts a file rather
            # than recording progress, so use it only by agreement in review.
            # The -f guard keeps this block runnable from a scratch workspace
            # (tests/test_duckdb_connection_factory_bypass.py runs the script
            # against a synthetic tree); test_sql_path_escaping.py asserts the
            # checker is present and wired in, so it cannot go missing for real.
            if [ -f scripts/check_sql_path_literals.py ] \
                && ! python3 scripts/check_sql_path_literals.py; then
              errors=1
            fi
            exit $errors
        language: system
        pass_filenames: false
        types: [python]

      # enforce logger usage over click.echo in core/
      - id: no-click-echo
        name: no-click-echo
        description: Use logger instead of click.echo in core/
        entry: bash
        args:
          - -c
          - |
            if grep -rn "click\.echo" geoparquet_io/core/ --include="*.py" | grep -v "logging_config.py"; then
              echo "ERROR: Use logger instead of click.echo in core/. See CLAUDE.md Logging section."
              exit 1
            fi
        language: system
        pass_filenames: false
        types: [python]

      # Forbid hand-rolling paginated-schema reconciliation in extractors.
      # WFS and ArcGIS each grew separate, separately-buggy schema-alignment code
      # (18 + 8 fix commits). The canonical helpers live in core/common.py:
      # _compute_unified_schema and _cast_table_to_schema. New extractors must reuse them.
      - id: forbid-bespoke-schema-reconciliation
        name: forbid-bespoke-schema-reconciliation
        description: Use shared schema helpers from core/common.py, not hand-rolled ones
        entry: bash
        args:
          - -c
          - |
            if grep -rnE 'def _(align|unify|reconcile)[a-zA-Z_]*schema' geoparquet_io/core/ --include="*.py" | grep -v "common.py"; then
              echo "ERROR: Reuse _compute_unified_schema / _cast_table_to_schema from core/common.py"
              echo "       instead of hand-rolling schema reconciliation. See the WFS/ArcGIS history"
              echo "       and docs/contributing.md (External extractors)."
              exit 1
            fi
        language: system
        pass_filenames: false
        types: [python]

      # mutmut's stats-phase trampoline resolves the relative source_paths
      # (geoparquet_io/) against the process CWD on EVERY instrumented call, so
      # any test that changes the working directory crashes stats collection
      # with "FileNotFoundError: 'geoparquet_io'" and takes the nightly mutation
      # job down (silently, until #552 hardened the exit-code handling). Keep the
      # suite CWD-stable: use the tmp_path fixture + absolute paths, or
      # os.path.relpath for relative-path coverage. Justify a rare, deliberate
      # exception with a trailing "# allow-cwd-change" comment.
      - id: no-cwd-change-in-tests
        name: no-cwd-change-in-tests
        description: Tests must not change the process CWD (breaks mutmut stats phase)
        entry: bash
        args:
          - -c
          - |
            if grep -rnE '(isolated_filesystem\(|os\.chdir\(|monkeypatch\.chdir\()' tests/ --include="*.py" | grep -v 'allow-cwd-change'; then
              echo "ERROR: Tests must not change the process CWD."
              echo "       isolated_filesystem() / os.chdir() / monkeypatch.chdir() break"
              echo "       mutmut's stats-phase trampoline (it resolves the relative"
              echo "       source_paths against CWD) and take the nightly mutation job down."
              echo "       Use the tmp_path fixture with absolute paths, or os.path.relpath"
              echo "       for relative-path coverage. Justify a rare exception with a"
              echo "       trailing '# allow-cwd-change' comment."
              exit 1
            fi
        language: system
        pass_filenames: false
        types: [python]

      - id: check-api-for-cli
        name: check-api-for-cli
        description: Remind to add Python API for new CLI commands
        entry: bash
        args:
          - -c
          - |
            # This is a reminder hook - it doesn't fail, just warns
            if git diff --cached --name-only | grep -qE "geoparquet_io/cli/(main\.py|commands/)"; then
              echo "⚠️  Reminder: If you added new CLI commands, ensure you also:"
              echo "   1. Added corresponding methods to api/table.py"
              echo "   2. Added corresponding functions to api/ops.py"
              echo "   3. Updated docs/api/python-api.md"
              echo "   See CLAUDE.md Quick Checklist for details."
            fi
        language: system
        pass_filenames: false
        always_run: true

      - id: validate-claude-md
        name: validate-claude-md
        description: Validate CLAUDE.md against the actual codebase
        entry: uv run python scripts/validate_claude_md.py
        language: system
        files: ^(CLAUDE\.md|geoparquet_io/cli/main\.py|geoparquet_io/cli/commands/.*\.py|pyproject\.toml)$
        pass_filenames: false

      - id: doc-sync
        name: doc-sync
        description: Auto-update generated doc sections (CLAUDE.md, SKILL.md, contributing.md)
        entry: uv run python scripts/doc_sync.py --update
        language: system
        files: ^(CHANGELOG\.md|geoparquet_io/cli/main\.py|geoparquet_io/cli/commands/.*\.py|geoparquet_io/cli/decorators\.py|pyproject\.toml|geoparquet_io/core/.*\.py|scripts/doc_sync\.py|docs/contributing\.md)$
        pass_filenames: false

      - id: sync-dependencies
        name: sync-dependencies
        description: Auto-sync dependencies when pyproject.toml changes
        entry: bash
        args:
          - -c
          - |
            # Check if pyproject.toml was changed
            if git diff --cached --name-only | grep -q "^pyproject.toml$"; then
              if command -v uv &> /dev/null; then
                echo "📦 pyproject.toml changed, running uv sync..."
                uv sync --all-extras
                echo "✅ Dependencies synced"
              fi
            fi
        language: system
        pass_filenames: false
        always_run: true

  # -------------------------------------------------------------------------
  # Pre-push hooks (thorough checks, can be slower)
  # -------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: deptry
        name: deptry
        description: Check for dependency issues
        entry: uv run deptry .
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: mypy
        name: mypy
        description: Static type check (same gate as CI)
        entry: uv run mypy geoparquet_io/
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: vulture
        name: vulture
        description: Find unused code (paths/confidence from [tool.vulture])
        entry: uv run vulture
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: xenon
        name: xenon
        description: Monitor code complexity (same scope as CI)
        entry: uv run xenon --max-absolute=E --max-modules=D --max-average=C geoparquet_io tests
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: import-linter
        name: import-linter
        description: Enforce architecture (core must not import click, api must not import cli)
        entry: uv run lint-imports
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: menard-check
        name: menard-check
        description: Check if documentation is stale relative to code changes
        entry: uv run menard check
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: fast-tests
        name: fast-tests
        description: Run fast tests (optional - enable with ENABLE_PRE_PUSH_TESTS=1)
        entry: bash
        args:
          - -c
          - |
            # Only run if explicitly enabled via environment variable
            if [ "$ENABLE_PRE_PUSH_TESTS" = "1" ]; then
              echo "Running fast tests..."
              uv run pytest -n auto -m "not slow and not network and not meta" --tb=short
            else
              # Silent pass - tests not enabled
              exit 0
            fi
        language: system
        pass_filenames: false
        stages: [pre-push]
