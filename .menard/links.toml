# Note: __init__.py files export public API, not related to plugins.md
# plugins.md documents the plugin system (entry points, installation)
# These were incorrectly auto-generated by menard bootstrap

[[link]]
code = "geoparquet_io/cli/main.py"
docs = ["docs/contributing.md"]

# main.py keeps the root group, global options and the `check`/`skills` commands;
# every other group now lives in cli/commands/<group>.py. Adding or changing a
# subcommand there goes stale in exactly the same docs, so the group modules carry
# the same links. Without this, a new `gpio add foo` touches only cli/commands/add.py
# and menard reports "up-to-date" while the prose it guards rots.
[[link]]
code = "geoparquet_io/cli/commands/*.py"
docs = ["docs/contributing.md"]

# CLAUDE.md mappings (LLM-focused documentation)
[[link]]
code = "geoparquet_io/cli/main.py"
docs = ["CLAUDE.md#CLI Command Groups", "CLAUDE.md#Architecture & Key Files"]

# "Architecture & Key Files" above is a stale section name — CLAUDE.md's heading is
# plain "Architecture" — so that half of the main.py link has never resolved
# (`menard validate-links` reports it). Point the new entry at the real heading
# rather than duplicating the broken one; fixing the main.py entry is a separate change.
[[link]]
code = "geoparquet_io/cli/commands/*.py"
docs = ["CLAUDE.md#CLI Command Groups", "CLAUDE.md#Architecture"]

[[link]]
code = "geoparquet_io/cli/decorators.py"
docs = ["CLAUDE.md#Key Patterns", "geoparquet_io/skills/geoparquet.md#Compression Options"]

